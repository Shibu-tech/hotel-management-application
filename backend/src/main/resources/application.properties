spring.application.name=hotel-management
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:backend/.env[.properties]
server.port=${PORT:8080}

# PostgreSQL Database (Neon connection defaults for local dev, overridable by environment variables)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://ep-solitary-sky-az1va1rw-pooler.c-3.ap-southeast-1.aws.neon.tech/hotel-management?sslmode=require&channelBinding=require}
spring.datasource.username=${DATABASE_USERNAME:hotel-management_owner}
spring.datasource.password=${DATABASE_PASSWORD:npg_6UaRbi8NoKSs}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration (Auto-update schema so new models like Department are synced)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection Pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

# JWT Configuration (Supports env variable, fallback for local dev)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Cookie Session Configuration
app.cookie.name=${AUTH_COOKIE_NAME:hotel_auth_token}
app.cookie.secure=${AUTH_COOKIE_SECURE:false}
app.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}

# Explicit CORS Allowed Origins (Comma-separated, no wildcards)
app.cors.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# Login Rate Limiting & Account Lockout
app.auth.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
app.auth.lockout-minutes=${AUTH_LOCKOUT_MINUTES:15}
app.auth.rate-limit-max-attempts=${AUTH_RATE_LIMIT_MAX:15}
app.auth.rate-limit-window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}

# Frontend Base URL for Dynamic QR Generation
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}

# QR Code Configuration
app.qr.width=${QR_WIDTH:300}
app.qr.height=${QR_HEIGHT:300}
