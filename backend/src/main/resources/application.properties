spring.application.name=hotel-management
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

# PostgreSQL Database (Required via environment variables — never commit credentials)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration (Use versioned SQL migrations in production; validate by default)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection Pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

# JWT Configuration (Required via environment variable — minimum 32-byte secret)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Cookie Session Configuration
app.cookie.name=${AUTH_COOKIE_NAME:hotel_auth_token}
app.cookie.secure=${AUTH_COOKIE_SECURE:false}
app.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}

# Explicit CORS Allowed Origins (Comma-separated, no wildcards)
app.cors.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# Login Rate Limiting & Account Lockout
app.auth.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
app.auth.lockout-minutes=${AUTH_LOCKOUT_MINUTES:15}
app.auth.rate-limit-max-attempts=${AUTH_RATE_LIMIT_MAX:15}
app.auth.rate-limit-window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}

# Frontend Base URL for Dynamic QR Generation
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}

# QR Code Configuration
app.qr.width=${QR_WIDTH:300}
app.qr.height=${QR_HEIGHT:300}
