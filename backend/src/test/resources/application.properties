spring.application.name=hotel-management-test

# Isolated H2 in-memory database configured in PostgreSQL compatibility mode
# NEVER connects to live Neon PostgreSQL
spring.datasource.url=jdbc:h2:mem:hotel_saas_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Deterministic test-only signing secret (>= 32 bytes)
app.jwt.secret=test-only-signing-secret-key-for-isolated-junit-tests-minimum-64-bytes-0001
app.jwt.expiration-ms=3600000

app.cookie.name=hotel_auth_token
app.cookie.secure=false
app.cookie.same-site=Lax

app.cors.allowed-origins=http://localhost:3000
app.frontend.base-url=http://localhost:3000

app.auth.max-failed-attempts=5
app.auth.lockout-minutes=15
app.auth.rate-limit-max-attempts=100
app.auth.rate-limit-window-seconds=60
